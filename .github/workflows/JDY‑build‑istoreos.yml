# ============================================================
# iStoreOS 24.10 固件云编译 — 京东云 RE-SP-01B
# 优化版 v2.0
# ============================================================
name: Build iStoreOS 24.10 for JDCloud RE-SP-01B

on:
  workflow_dispatch:
    inputs:
      lan_ip:
        description: '设置 LAN IP 地址'
        required: true
        default: '192.168.12.1'
      os_name:
        description: '设置系统名称'
        required: true
        default: 'iStore OS'
      enable_wifi:
        description: '启用 WiFi'
        required: true
        default: false
        type: boolean
      ssh:
        description: 'SSH 远程调试'
        required: false
        default: 'false'
  schedule:
    - cron: 0 16 * * *

env:
  # 主仓库源（GitHub Actions 海外 runner 直连 GitHub 更快）
  REPO_URL: https://github.com/istoreos/istoreos
  REPO_BRANCH: istoreos-24.10
  # 文件路径（指向仓库中对应子目录）
  CONFIG_FILE: mt7621‑sp‑01b‑24.10/.config
  DIY_P1_SH: scripts/diy-part1.sh
  DIY_P2_SH: scripts/diy-part2.sh
  # 阿里云 OpenWrt 下载镜像（加速 make download）
  ALIYUN_MIRROR: https://mirrors.aliyun.com/openwrt
  TZ: Asia/Shanghai

jobs:
  build-istoreos:
    runs-on: ubuntu-22.04

    steps:
      # ----------------------------------------------------------
      # 1. 检出仓库
      # ----------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # 2. 安装编译依赖
      # ----------------------------------------------------------
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # 腾出磁盘空间
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache

          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ binutils bzip2 flex bison \
            autoconf automake make cmake libncurses-dev libz-dev libssl-dev git curl \
            wget unzip time rsync python3 python3-pip

      # ----------------------------------------------------------
      # 3. 克隆 iStoreOS 源码
      # ----------------------------------------------------------
      - name: Clone iStoreOS source
        run: |
          git clone --depth 1 -b ${{ env.REPO_BRANCH }} ${{ env.REPO_URL }} openwrt

      # ----------------------------------------------------------
      # 4. 传递用户输入参数到编译脚本
      # ----------------------------------------------------------
      - name: Pass inputs to build scripts
        run: |
          echo "LAN_IP=${{ github.event.inputs.lan_ip || '192.168.10.1' }}" >> $GITHUB_ENV
          echo "OS_NAME=${{ github.event.inputs.os_name || 'iStore OS' }}" >> $GITHUB_ENV
          echo "ENABLE_WIFI=${{ github.event.inputs.enable_wifi || 'false' }}" >> $GITHUB_ENV

      # ----------------------------------------------------------
      # 5. DIY Part1 — 源码层面的自定义修改（文件不存在则跳过）
      # ----------------------------------------------------------
      - name: DIY Part1
        run: |
          if [ -f "./${{ env.DIY_P1_SH }}" ]; then
            chmod +x ./${{ env.DIY_P1_SH }}
            ./${{ env.DIY_P1_SH }}
          else
            echo "⚠️ 未找到 ${{ env.DIY_P1_SH }}，跳过 DIY Part1"
          fi
        working-directory: ./

      # ----------------------------------------------------------
      # 6. 复制 .config（并追加阿里云下载镜像）
      # ----------------------------------------------------------
      - name: Copy config & apply mirrors
        run: |
          # 复制 .config（如果存在），并追加阿里云下载镜像
          if [ -f "./${{ env.CONFIG_FILE }}" ]; then
            cp -f ./${{ env.CONFIG_FILE }} ./openwrt/.config
          else
            echo "⚠️ 未找到 ${{ env.CONFIG_FILE }}，将使用 iStoreOS 默认配置"
          fi
          echo "CONFIG_MIRROR=\"${{ env.ALIYUN_MIRROR }}\"" >> ./openwrt/.config
        working-directory: ./

      # ----------------------------------------------------------
      # 7. 更新 & 安装 feeds（自动移除有问题的包）
      # ----------------------------------------------------------
      - name: Update & Install feeds
        run: |
          # 更新 feeds（克隆所有源）
          ./scripts/feeds update -a || true
          
          # 移除有问题的包（上游 Makefile 语法错误，暂时跳过）
          # 1. linkease_nas_luci 中的坏包
          for bad_pkg in luci-mod-istorenext luci-nginxer; do
            pkg_dir="feeds/linkease_nas_luci/luci/$bad_pkg"
            if [ -d "$pkg_dir" ]; then
              echo "⚠️ 移除有问题的包: $pkg_dir"
              rm -rf "$pkg_dir"
            fi
          done
          
          # 安装 feeds（跳过已移除的坏包）
          ./scripts/feeds install -a || true
          
          echo "✅ Feeds 更新完成"
        working-directory: ./openwrt

      # ----------------------------------------------------------
      # 8. DIY Part2 — 配置层面的自定义修改（文件不存在则跳过）
      # ----------------------------------------------------------
      - name: DIY Part2
        run: |
          if [ -f "../${{ env.DIY_P2_SH }}" ]; then
            chmod +x ../${{ env.DIY_P2_SH }}
            ../${{ env.DIY_P2_SH }} ${{ env.REPO_BRANCH }} mt7621-sp-01b-24.10
          else
            echo "⚠️ 未找到 ${{ env.DIY_P2_SH }}，跳过 DIY Part2"
          fi
        working-directory: ./openwrt

      # ----------------------------------------------------------
      # 9. 初始化配置（make defconfig 补全依赖关系）
      # ----------------------------------------------------------
      - name: Init config
        run: |
          make defconfig
          echo "✅ .config 依赖已补全"
          # 检查设备是否在配置中
          echo "--- 设备配置检查 ---"
          grep -E "CONFIG_TARGET|CONFIG_DEVICE" .config | head -20
          echo "---"
        working-directory: ./openwrt

      # ----------------------------------------------------------
      # 10. 缓存 dl 目录（加速后续编译）
      # ----------------------------------------------------------
      - name: Cache dl
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: dl-${{ hashFiles('openwrt/.config') }}
          restore-keys: |
            dl-

      # ----------------------------------------------------------
      # 11. 下载软件包（阿里云镜像加速 + 重试 + 不完整文件清理）
      # ----------------------------------------------------------
      - name: Download source
        id: download
        run: |
          cd openwrt
          # 阿里云镜像已在 .config 中配置为 CONFIG_MIRROR，自动加速下载
          make download -j$(nproc) || make download -j1 V=s
          # 清理小于 1KB 的不完整文件，重新下载
          find dl -size -1024c -exec ls -la {} \;
          find dl -size -1024c -exec rm -f {} \;
          make download -j1
          echo "dl_ready=true" >> $GITHUB_OUTPUT

      # ----------------------------------------------------------
      # 12. 编译固件
      # ----------------------------------------------------------
      - name: Compile firmware
        id: compile
        run: |
          cd openwrt
          # 先用多线程快速编译（实时输出到日志）
          make -j$(nproc) 2>&1 | tee build.log
          exit_code=${PIPESTATUS[0]}
          if [ $exit_code -ne 0 ]; then
            echo "===== 多线程编译失败(exit=$exit_code)，切换到单线程 V=sc 详细模式 ====="
            make -j1 V=sc 2>&1 | tee build-single.log
            vsc_exit=${PIPESTATUS[0]}
            echo "===== 单线程退出码: $vsc_exit ====="
            echo "===== 最后 80 行错误日志 ====="
            tail -80 build-single.log 2>/dev/null || tail -80 build.log
            echo "====="
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "status=success" >> $GITHUB_OUTPUT

      # ----------------------------------------------------------
      # 13. 上传编译日志（无论成功失败都传）
      # ----------------------------------------------------------
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: istoreos-build-logs
          path: |
            openwrt/build.log
            openwrt/build-single.log
          retention-days: 30

      # ----------------------------------------------------------
      # 14. 上传固件（仅编译成功时）
      # ----------------------------------------------------------
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success'
        with:
          name: istoreos-firmware
          path: openwrt/bin/targets/
          retention-days: 90

      # ----------------------------------------------------------
      # 15. SSH 远程调试（手动触发时启用）
      # ----------------------------------------------------------
      - name: Setup SSH debug
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event.inputs.ssh == 'true' }}
        timeout-minutes: 30
