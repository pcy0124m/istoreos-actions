name: JDY‑Build iStore OS 24.10
on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      lan_ip:
        description: '设置LAN IP地址'
        required: true
        default: '192.168.10.1'
      os_name:
        description: '设置系统名称'
        required: true
        default: 'iStore OS'
      enable_wifi:
        description: '启用WiFi'
        required: true
        default: false
        type: boolean
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'
  schedule:
   - cron: 0 16 * * *

env:
  REPO_URL: https://github.com/istoreos/istoreos
  REPO_BRANCH: istoreos-24.10
  FEEDS_CONF: feeds.conf
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ binutils bzip2 flex bison autoconf automake make cmake libncurses-dev libz-dev libssl-dev git curl wget unzip time rsync python3 python3-pip

      - name: Clone iStoreOS source
        run: |
          git clone --depth 1 -b ${{ env.REPO_BRANCH }} ${{ env.REPO_URL }} openwrt
          cd openwrt

      - name: DIY Part1
        run: |
          chmod +x ./${{ env.DIY_P1_SH }}
          ./${{ env.DIY_P1_SH }}
        working-directory: ./

      - name: Copy feeds.conf and .config
        run: |
          cp -f ./${{ env.FEEDS_CONF }} ./openwrt/feeds.conf
          cp -f ./${{ env.CONFIG_FILE }} ./openwrt/.config
        working-directory: ./

      - name: Update & Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
        working-directory: ./openwrt

      - name: DIY Part2
        run: |
          chmod +x ../${{ env.DIY_P2_SH }}
          ../${{ env.DIY_P2_SH }}
        working-directory: ./openwrt

      - name: Download source code
        run: |
          make download -j$(nproc)
        working-directory: ./openwrt

      - name: Compile firmware
        run: |
          make -j$(nproc) || make -j1 V=s
        working-directory: ./openwrt

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: iStoreOS-firmware
          path: openwrt/bin/targets/
