# ============================================================
# iStoreOS 24.10 固件云编译 — 京东云 RE-SP-01B
# 优化版 v2.0
# ============================================================
名称: 为京东云 RE-SP-01B 构建 iStoreOS 24.10

开启:
  workflow_dispatch:
    输入:
      lan_ip:
        描述: '设置 LAN IP 地址'
        必填: 是
        默认值: '192.168.10.1'
      os_name:
        描述: '设置系统名称'
        必填: 是
        默认值: 'iStore OS'
      启用Wi-Fi:
        描述: '启用 WiFi'
        必填: 是
        默认值: false
        类型: 布尔值
      ssh:
        描述: 'SSH 远程调试'
        是否必填: false
        默认值: 'false'
  调度:
    - cron: 0 16 * * *

env:
  # 主仓库源（国内用 Gitee 镜像加速，国外用 GitHub 原版）
  REPO_URL: https://gitee.com/istoreos/istoreos
  REPO_BRANCH: istoreos-24.10
  # 如果 Gitee 镜像拉取失败，注释上面两行，取消注释下面两行：
  # REPO_URL: https://github.com/istoreos/istoreos
  # REPO_BRANCH: istoreos-24.10
  FEEDS_CONF: feeds.conf
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  # 阿里云 OpenWrt 下载镜像（加速 make download）
  ALIYUN_MIRROR: https://mirrors.aliyun.com/openwrt
  TZ: Asia/Shanghai

jobs:
  build-istoreos:
    runs-on: ubuntu-22.04

    steps:
      # ----------------------------------------------------------
      # 1. 检出仓库
      # ----------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # 2. 安装编译依赖
      # ----------------------------------------------------------
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # 腾出磁盘空间
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache

          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ binutils bzip2 flex bison \
            autoconf automake make cmake libncurses-dev libz-dev libssl-dev git curl \
            wget unzip time rsync python3 python3-pip

      # ----------------------------------------------------------
      # 3. 克隆 iStoreOS 源码
      # ----------------------------------------------------------
      - name: Clone iStoreOS source
        run: |
          git clone --depth 1 -b ${{ env.REPO_BRANCH }} ${{ env.REPO_URL }} openwrt

      # ----------------------------------------------------------
      # 4. 传递用户输入参数到编译脚本
      # ----------------------------------------------------------
      - name: Pass inputs to build scripts
        run: |
          echo "LAN_IP=${{ github.event.inputs.lan_ip || '192.168.10.1' }}" >> $GITHUB_ENV
          echo "OS_NAME=${{ github.event.inputs.os_name || 'iStore OS' }}" >> $GITHUB_ENV
          echo "ENABLE_WIFI=${{ github.event.inputs.enable_wifi || 'false' }}" >> $GITHUB_ENV

      # ----------------------------------------------------------
      # 5. DIY Part1 — 源码层面的自定义修改
      # ----------------------------------------------------------
      - name: DIY Part1
        run: |
          chmod +x ./${{ env.DIY_P1_SH }}
          ./${{ env.DIY_P1_SH }}
        working-directory: ./

      # ----------------------------------------------------------
      # 6. 复制 feeds 配置和 .config（并替换为国内镜像源）
      # ----------------------------------------------------------
      - name: Copy config files & apply mirrors
        run: |
          # 复制 feeds 配置，并将 github.com 替换为 gitee.com（国内镜像加速）
          cp -f ./${{ env.FEEDS_CONF }} ./openwrt/feeds.conf
          sed -i 's|https://github.com/|https://gitee.com/|g' ./openwrt/feeds.conf

          # 复制 .config，并追加阿里云下载镜像
          cp -f ./${{ env.CONFIG_FILE }} ./openwrt/.config
          echo "CONFIG_MIRROR=\"${{ env.ALIYUN_MIRROR }}\"" >> ./openwrt/.config
        working-directory: ./

      # ----------------------------------------------------------
      # 7. 更新 & 安装 feeds
      # ----------------------------------------------------------
      - name: Update & Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
        working-directory: ./openwrt

      # ----------------------------------------------------------
      # 8. DIY Part2 — 配置层面的自定义修改
      # ----------------------------------------------------------
      - name: DIY Part2
        run: |
          chmod +x ../${{ env.DIY_P2_SH }}
          ../${{ env.DIY_P2_SH }}
        working-directory: ./openwrt

      # ----------------------------------------------------------
      # 9. 缓存 dl 目录（加速后续编译）
      # ----------------------------------------------------------
      - name: Cache dl
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: dl-${{ hashFiles('openwrt/.config') }}
          restore-keys: |
            dl-

      # ----------------------------------------------------------
      # 10. 下载软件包（阿里云镜像加速 + 重试 + 不完整文件清理）
      # ----------------------------------------------------------
      - name: Download source
        id: download
        run: |
          cd openwrt
          # 阿里云镜像已在 .config 中配置为 CONFIG_MIRROR，自动加速下载
          make download -j$(nproc) || make download -j1 V=s
          # 清理小于 1KB 的不完整文件，重新下载
          find dl -size -1024c -exec ls -la {} \;
          find dl -size -1024c -exec rm -f {} \;
          make download -j1
          echo "dl_ready=true" >> $GITHUB_OUTPUT

      # ----------------------------------------------------------
      # 11. 编译固件
      # ----------------------------------------------------------
      - name: Compile firmware
        id: compile
        run: |
          cd openwrt
          make -j$(nproc) 2>&1 | tee build.log || {
            echo "===== 多线程编译失败，切换到单线程重试 ====="
            make -j1 V=s 2>&1 | tee build-single.log
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          }
          echo "status=success" >> $GITHUB_OUTPUT

      # ----------------------------------------------------------
      # 12. 上传编译日志（无论成功失败都传）
      # ----------------------------------------------------------
      - 名称: 上传构建日志
        如果: 始终()
        使用: actions/upload-artifact@v4
        with:
：istoreos-build-logs
          路径: |
            openwrt/build.log
            openwrt/build-single.log
          保留天数: 30

      # ----------------------------------------------------------
      # 13. 上传固件（仅编译成功时）
      # ----------------------------------------------------------
      - 名称: 上传固件
使用: actions/upload-artifact@v4
        如果: steps.compile.outputs.status == 'success'
        with:
          名称: istoreos-firmware
          路径: openwrt/bin/targets/
          保留天数: 90

      # ----------------------------------------------------------
      # 14. SSH 远程调试（手动触发时启用）
      # ----------------------------------------------------------
      - 名称: 设置SSH调试
        使用: mxschmitt/action-tmate@v3
        如果: ${{ github.event.inputs.ssh == 'true' }}
        超时时间（分钟）：30
